[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openminion-example-research-brief"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["openminion>=0.1.24,<0.2", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.16"]

[project.scripts]
research-brief = "research_brief.app:main"

[tool.pytest.ini_options]
markers = ["live: requires an explicitly configured provider"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
